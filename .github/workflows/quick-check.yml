# ⚠️ INACTIVE TEMPLATE — the live CI is .gitea/workflows/ci.yml. Kept as a reference.
#
# NOTE the `if: false` guards: this repo now ALSO mirrors to GitHub, where the old
# trigger spawned a doomed queued run on every push (GitHub has no `fnos-shell`
# runner). The ROADMAP v6 §4A plan replaces this with real hosted linux/windows jobs.
#
# CI Quick Check — 每次 push 触发
# 运行在 fnos (N200/12G) shell runner 上
# 仅做格式检查 + 轻量静态分析，不跑编译

name: Quick Check (inactive — see .gitea/workflows/ci.yml)

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  lint:
    if: false   # inactive template — never schedule (see header note)
    runs-on: fnos-shell
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Check clang-format
        run: |
          if ! command -v clang-format &> /dev/null; then
            echo "[SKIP] clang-format not installed"
            exit 0
          fi
          cd modules
          find . -name "*.hpp" -o -name "*.cpp" | while read f; do
            clang-format --dry-run --Werror -style=file "../" "$f" 2>&1 || {
              echo "::error file=$f::Format violation"
            }
          done

      - name: Check .clang-format exists
        run: |
          if [ ! -f .clang-format ]; then
            echo "::error::.clang-format missing in repo root"
            exit 1
          fi

  summary:
    needs: [lint]
    if: false   # inactive template — never schedule (see header note)
    runs-on: fnos-shell
    steps:
      - name: Result
        run: |
          if [ "${{ needs.lint.result }}" = "success" ]; then
            echo "✅ All checks passed"
          else
            echo "❌ Checks failed — review logs above"
          fi
